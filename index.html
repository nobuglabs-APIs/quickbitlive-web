      (function() {
        try {
          var root = typeof window !== 'undefined' ? window : typeof globalThis !== 'undefined' ? globalThis : self;
          if (root && root.fetch) {
            var currentFetch = root.fetch.bind(root);
            try {
              Object.defineProperty(root, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(newFetch) {
                  currentFetch = newFetch;
                },
                configurable: true,
                enumerable: true
              });
            } catch (err) {
              try {
                if (window.Window && window.Window.prototype) {
                  Object.defineProperty(window.Window.prototype, 'fetch', {
                    get: function() {
                      return currentFetch;
                    },
                    set: function(newFetch) {
                      currentFetch = newFetch;
                    },
                    configurable: true,
                    enumerable: true
                  });
                }
              } catch (e) {}
            }
          }
        } catch (e) {}
      })();
